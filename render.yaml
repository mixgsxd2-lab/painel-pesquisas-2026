# Blueprint do Render (https://render.com/docs/blueprint-spec)
# Um único serviço web: site + agendador no mesmo processo, com disco persistente para o SQLite.
services:
  - type: web
    name: painel-pesquisas-2026
    runtime: python
    plan: starter            # disco persistente exige plano pago; o plano free "dorme" e para o agendador
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATA_DIR
        value: /var/data
      - key: RUN_SCHEDULER
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_CONTATO
        sync: false
      - key: EMAIL_DONO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: BRAVE_API_KEY
        sync: false

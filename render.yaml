# Blueprint do Render (https://render.com/docs/blueprint-spec)
# Plano GRATUITO: sem agendador — as visitas disparam a atualização (core/gatilho.py).
# Atenção: no plano gratuito o disco é temporário. Quando o serviço reinicia ou "dorme",
# o banco SQLite é recriado do zero na próxima visita (veja o README).
services:
  - type: web
    name: painel-pesquisas-2026
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AUTO_ATUALIZAR
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_CONTATO
        sync: false
      - key: EMAIL_DONO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: BRAVE_API_KEY
        sync: false
